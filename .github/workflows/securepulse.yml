name: SecurePulse Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scan:
    name: SAST + DAST + SCA
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            target-apps/app1-nodejs-api/package-lock.json
            target-apps/app2-react-node/backend/package-lock.json
            target-apps/app2-react-node/frontend/package-lock.json

      # Install the target apps
      - name: Install app1 dependencies
        working-directory: target-apps/app1-nodejs-api
        run: npm ci

      - name: Install app2 backend dependencies
        working-directory: target-apps/app2-react-node/backend
        run: npm ci

      - name: Install app2 frontend dependencies
        working-directory: target-apps/app2-react-node/frontend
        run: npm ci

      # Run SAST
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Export Semgrep results as JSON
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --json \
            --output semgrep-results.json \
            --no-git-ignore || true
        continue-on-error: true

      # Run SCA
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: '.'
          format: 'JSON'
          out: 'dependency-check-report'
          args: >
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      # Start app2 
      - name: Start app2 backend
        working-directory: target-apps/app2-react-node/backend
        run: nohup npm start > /tmp/app2-backend.log 2>&1 &
        continue-on-error: true

      - name: Start app2 frontend
        working-directory: target-apps/app2-react-node/frontend
        run: nohup npm run dev -- --host 0.0.0.0 --port 4003 > /tmp/app2-frontend.log 2>&1 &
        continue-on-error: true

      - name: Wait for app2 to be ready
        run: |
          sleep 5
          curl --retry 5 --retry-delay 3 http://localhost:4002/health || true
          curl --retry 5 --retry-delay 3 http://localhost:4003 || true
        continue-on-error: true

      # Run DAST
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4003'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-J zap-results.json'
        continue-on-error: true

      # Send results 
      - name: Post SAST results to SecurePulse
        run: |
          if [ -f semgrep-results.json ]; then
            curl -s -X POST "${{ secrets.NGROK_URL }}/api/scans/sast" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${{ secrets.SECUREPULSE_API_KEY }}" \
              -d @semgrep-results.json || echo "SAST post failed (backend may be offline)"
          else
            echo "No Semgrep results file found"
          fi
        continue-on-error: true

      - name: Post SCA results to SecurePulse
        run: |
          REPORT=$(find dependency-check-report -name "*.json" | head -1)
          if [ -f "$REPORT" ]; then
            curl -s -X POST "${{ secrets.NGROK_URL }}/api/scans/sca" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${{ secrets.SECUREPULSE_API_KEY }}" \
              -d @"$REPORT" || echo "SCA post failed (backend may be offline)"
          else
            echo "No Dependency-Check results file found"
          fi
        continue-on-error: true

      - name: Post DAST results to SecurePulse
        run: |
          if [ -f zap-results.json ]; then
            curl -s -X POST "${{ secrets.NGROK_URL }}/api/scans/dast" \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${{ secrets.SECUREPULSE_API_KEY }}" \
              -d @zap-results.json || echo "DAST post failed (backend may be offline)"
          else
            echo "No ZAP results file found"
          fi
        continue-on-error: true

      # Upload scan artifacts
      - name: Upload scan results as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: securepulse-scan-results
          path: |
            semgrep-results.json
            dependency-check-report/
            zap-results.json
          retention-days: 30
